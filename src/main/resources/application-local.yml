cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-in-seconds: 1800
  refresh-token-validity-in-seconds: 1209600
  cookie-secure: false

server:
  url: http://localhost:8080

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    com.jobhelper.careerflowapi.user.infrastructure.VerificationSessionRepository: DEBUG
    com.jobhelper.careerflowapi.user.infrastructure.PendingSignupRepository: DEBUG
