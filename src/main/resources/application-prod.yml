cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-in-seconds: 1800
  refresh-token-validity-in-seconds: 604800
  cookie-secure: true

logging:
  level:
    root: WARN
    dev.wonyoung: INFO

server:
  url: ${SERVER_URL}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
