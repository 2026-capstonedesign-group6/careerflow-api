cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-in-seconds: 1800
  refresh-token-validity-in-seconds: 1209600
  cookie-secure: true

server:
  url: ${SERVER_URL}

springdoc:
  swagger-ui:
    enabled: true
