spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/monolith_local
    username: monolith_local
    password: monolith_local
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: smtp.gmail.com
    port: 587
    username: test@test.com
    password: test-password
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: test-jwt-secret-key-for-testing-purposes-only
  access-token-validity-in-seconds: 1800
  refresh-token-validity-in-seconds: 1209600
  cookie-secure: false

openai:
  api-key: test-openai-api-key

cors:
  allowed-origins: http://localhost:3000

oauth2:
  providers:
    kakao:
      client-id: test-kakao-client-id
      client-secret: test-kakao-client-secret
      redirect-uri: http://localhost:5173/oauth2/callback/kakao
    google:
      client-id: test-google-client-id
      client-secret: test-google-client-secret
      redirect-uri: http://localhost:5173/oauth2/callback/google

server:
  url: http://localhost:8080

springdoc:
  swagger-ui:
    enabled: false
