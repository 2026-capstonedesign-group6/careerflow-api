name: Bug
description: 버그 제보
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - Critical (서비스 불가)
        - Major (주요 기능 오작동)
        - Minor (일부 기능 오작동)
        - Trivial (UI/UX 문제)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      placeholder: 어떤 문제가 발생했나요?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      placeholder: 정상적으로 동작했다면 어떻게 되어야 하나요?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      placeholder: 실제로 어떻게 동작하나요?
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 참고 사항
      placeholder: 스크린샷, 로그, 관련 링크 등 (선택)
